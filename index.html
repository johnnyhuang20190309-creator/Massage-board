<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨裝置共用留言板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200 flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white dark:bg-gray-800 shadow sticky top-0 z-50 border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-comments text-brand-600 dark:text-brand-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wider">共用留言板</h1>
            </div>
            <div class="flex items-center space-x-3">
                <!-- 狀態與主題切換 -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300" title="切換主題">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
                <div id="auth-nav-area" class="flex items-center space-x-2">
                    <!-- 動態登入狀態 -->
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- 系統公告區 -->
        <div id="announcement-banner" class="hidden bg-amber-50 dark:bg-amber-950/40 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
            <div class="flex items-start">
                <div class="flex-shrink-0 text-amber-500 text-xl mr-3"><i class="fa-solid fa-bullhorn"></i></div>
                <div>
                    <h3 class="font-bold text-amber-800 dark:text-amber-300">管理員系統公告</h3>
                    <p id="announcement-text" class="text-amber-700 dark:text-amber-200 text-sm mt-1"></p>
                </div>
            </div>
        </div>

        <!-- 發表留言卡片 -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-5 border border-gray-100 dark:border-gray-700">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-brand-600"></i> 發表新留言
                </h2>
                <div id="current-user-badge" class="text-xs bg-brand-50 dark:bg-brand-900/50 text-brand-600 dark:text-brand-300 px-3 py-1 rounded-full font-medium">
                    請先登入以發言
                </div>
            </div>
            
            <form id="post-form" onsubmit="handlePostSubmit(event)" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">分類</label>
                        <select id="post-category" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                            <option value="一般討論">💬 一般討論</option>
                            <option value="技術交流">💻 技術交流</option>
                            <option value="生活點滴">🌟 生活點滴</option>
                            <option value="管理公告" id="admin-cat-option" class="hidden">📌 系統公告 (管理員)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <textarea id="post-content" rows="3" placeholder="分享您的想法或提問..." required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 p-3 text-sm focus:ring-2 focus:ring-brand-500 outline-none resize-none"></textarea>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <div class="flex items-center space-x-2 text-xs text-gray-400">
                        <span>支援 Emoji 與網址自動預覽</span>
                    </div>
                    <button type="submit" id="submit-btn" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-5 py-2 rounded-lg text-sm shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> 發布留言
                    </button>
                </div>
            </form>
        </div>

        <!-- 搜尋與篩選列 -->
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-center bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-search"></i></span>
                <input type="text" id="search-input" oninput="renderPosts()" placeholder="搜尋留言內容或作者..." class="w-full pl-9 pr-4 py-1.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                <button onclick="setFilter('all')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-brand-600 text-white whitespace-nowrap">全部</button>
                <button onclick="setFilter('一般討論')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 whitespace-nowrap">一般討論</button>
                <button onclick="setFilter('技術交流')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 whitespace-nowrap">技術交流</button>
                <button onclick="setFilter('生活點滴')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 whitespace-nowrap">生活點滴</button>
            </div>
        </div>

        <!-- 留言清單區 -->
        <div id="posts-container" class="space-y-4">
            <!-- 動態載入留言 -->
        </div>

    </main>

    <!-- 登入 / 註冊 Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-5 border border-gray-100 dark:border-gray-700 animate-in">
            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-user-circle text-brand-600"></i> 會員登入
                </h3>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl font-bold">&times;</button>
            </div>

            <div class="bg-blue-50 dark:bg-blue-950/40 p-3 rounded-lg text-xs text-blue-700 dark:text-blue-300 flex items-center justify-between">
                <span>👑 管理員快速通道：帳號 <b>Johnny</b> / 密碼 <b>20190309</b></span>
                <button onclick="fillAdminCredentials()" class="bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700 font-medium">一鍵填入</button>
            </div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">帳號名稱</label>
                    <input type="text" id="auth-username" required placeholder="請輸入帳號名稱" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-gray-50 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">密碼</label>
                    <input type="password" id="auth-password" required placeholder="請輸入密碼" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-gray-50 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div id="auth-error" class="text-red-500 text-xs hidden"></div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 rounded-lg text-sm shadow transition">登入</button>
            </form>

            <div class="text-center text-xs text-gray-500">
                <span id="auth-switch-text">還沒有帳號？</span>
                <button onclick="toggleAuthMode()" id="auth-switch-btn" class="text-brand-600 dark:text-brand-400 font-medium hover:underline ml-1">點此註冊新帳號</button>
            </div>
        </div>
    </div>

    <!-- 腳本邏輯 -->
    <script>
        // 資料狀態初始化 (結合 localStorage 與 BroadcastChannel 支援同裝置多視窗即時同步)
        const STORAGE_KEY_POSTS = 'shared_board_posts_v2';
        const STORAGE_KEY_USERS = 'shared_board_users_v2';
        const STORAGE_KEY_SESSION = 'shared_board_session_v2';
        const STORAGE_KEY_ANNOUNCE = 'shared_board_announce_v2';
        const STORAGE_KEY_BANS = 'shared_board_bans_v2';

        const channel = new BroadcastChannel('shared_board_channel_v2');

        let currentUser = JSON.parse(localStorage.getItem(STORAGE_KEY_SESSION)) || null;
        let currentFilter = 'all';
        let isRegisterMode = false;

        // 預設建立管理員 Johnny
        function initSystem() {
            let users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS)) || [];
            if (!users.some(u => u.username === 'Johnny')) {
                users.push({ username: 'Johnny', password: '20190309', isAdmin: true });
                localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users));
            }
        }
        initSystem();

        // 監聽其他視窗的廣播更新
        channel.onmessage = (event) => {
            if (event.data.type === 'SYNC_UPDATE') {
                renderPosts();
                renderAnnouncement();
                checkUserBanStatus();
            }
        };

        function broadcastChange() {
            channel.postMessage({ type: 'SYNC_UPDATE' });
        }

        // 主題切換
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.className = 'fa-solid fa-moon';
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                icon.className = 'fa-solid fa-sun';
            }
        }
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
        }

        // 檢查使用者是否被禁言
        function checkUserBanStatus() {
            if (!currentUser) return;
            const bans = JSON.parse(localStorage.getItem(STORAGE_KEY_BANS)) || [];
            if (bans.includes(currentUser.username) && currentUser.username !== 'Johnny') {
                alert('您的帳號已被管理員禁言。');
                logout();
            }
        }

        // 導覽列與UI更新
        function updateUI() {
            const navArea = document.getElementById('auth-nav-area');
            const badge = document.getElementById('current-user-badge');
            const adminCat = document.getElementById('admin-cat-option');
            const submitBtn = document.getElementById('submit-btn');

            if (currentUser) {
                let badgeHtml = currentUser.username === 'Johnny' ? 
                    '<span class="bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300 px-2 py-0.5 rounded text-xs font-bold">👑 總管理員</span>' : 
                    '<span class="bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300 px-2 py-0.5 rounded text-xs font-medium">👤 會員</span>';
                
                navArea.innerHTML = `
                    <div class="flex items-center space-x-2 text-sm font-medium">
                        <i class="fa-solid fa-user-circle text-brand-600 text-lg"></i>
                        <span class="hidden sm:inline">${currentUser.username}</span>
                        ${badgeHtml}
                        <button onclick="logout()" class="text-xs bg-gray-200 dark:bg-gray-700 hover:bg-red-100 hover:text-red-600 px-2.5 py-1 rounded-lg transition ml-1">登出</button>
                    </div>
                `;
                badge.innerHTML = `目前發文身份：<strong>${currentUser.username}</strong>`;
                badge.className = "text-xs bg-emerald-50 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-300 px-3 py-1 rounded-full font-medium";
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                if (currentUser.username === 'Johnny') {
                    adminCat.classList.remove('hidden');
                } else {
                    adminCat.classList.add('hidden');
                }
            } else {
                navArea.innerHTML = `
                    <button onclick="openAuthModal('login')" class="bg-brand-600 hover:bg-brand-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium shadow transition">登入 / 註冊</button>
                `;
                badge.innerHTML = `請先登入以發言`;
                badge.className = "text-xs bg-amber-50 dark:bg-amber-900/50 text-amber-600 dark:text-amber-300 px-3 py-1 rounded-full font-medium";
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                adminCat.classList.add('hidden');
            }
            renderAnnouncement();
            renderPosts();
        }

        // 認證 Modal 控制
        function openAuthModal(mode) {
            isRegisterMode = (mode === 'register');
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-error').classList.add('hidden');
            document.getElementById('auth-form').reset();
            updateAuthModalUI();
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            updateAuthModalUI();
        }

        function updateAuthModalUI() {
            const title = document.getElementById('modal-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const switchText = document.getElementById('auth-switch-text');
            const switchBtn = document.getElementById('auth-switch-btn');

            if (isRegisterMode) {
                title.innerHTML = '<i class="fa-solid fa-user-plus text-brand-600"></i> 註冊新帳號';
                submitBtn.textContent = '註冊';
                switchText.textContent = '已經有帳號了？';
                switchBtn.textContent = '點此登入';
            } else {
                title.innerHTML = '<i class="fa-solid fa-user-circle text-brand-600"></i> 會員登入';
                submitBtn.textContent = '登入';
                switchText.textContent = '還沒有帳號？';
                switchBtn.textContent = '點此註冊新帳號';
            }
        }

        function fillAdminCredentials() {
            document.getElementById('auth-username').value = 'Johnny';
            document.getElementById('auth-password').value = '20190309';
        }

        function handleAuthSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorDiv = document.getElementById('auth-error');

            let users = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS)) || [];

            if (isRegisterMode) {
                if (users.some(u => u.username === username)) {
                    errorDiv.textContent = '該帳號名稱已被註冊，請換一個。';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                const newUser = { username, password, isAdmin: (username === 'Johnny') };
                users.push(newUser);
                localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users));
                currentUser = newUser;
            } else {
                const user = users.find(u => u.username === username && u.password === password);
                if (!user) {
                    errorDiv.textContent = '帳號或密碼錯誤，請重新確認。';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                currentUser = user;
            }

            localStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify(currentUser));
            closeAuthModal();
            updateUI();
            broadcastChange();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem(STORAGE_KEY_SESSION);
            updateUI();
            broadcastChange();
        }

        // 發佈留言
        function handlePostSubmit(event) {
            event.preventDefault();
            if (!currentUser) return;

            const content = document.getElementById('post-content').value.trim();
            const category = document.getElementById('post-category').value;

            if (!content) return;

            if (category === '管理公告' && currentUser.username !== 'Johnny') {
                alert('只有管理員 Johnny 可以發布系統公告！');
                return;
            }

            let posts = JSON.parse(localStorage.getItem(STORAGE_KEY_POSTS)) || [];
            const newPost = {
                id: 'post_' + Date.now(),
                author: currentUser.username,
                isAdmin: currentUser.username === 'Johnny',
                content: content,
                category: category,
                date: new Date().toLocaleString(),
                likes: 0,
                likedBy: [],
                isPinned: false,
                replies: []
            };

            if (category === '管理公告') {
                localStorage.setItem(STORAGE_KEY_ANNOUNCE, content);
            }

            posts.unshift(newPost);
            localStorage.setItem(STORAGE_KEY_POSTS, JSON.stringify(posts));
            document.getElementById('post-content').value = '';
            
            renderAnnouncement();
            renderPosts();
            broadcastChange();
        }

        // 公告渲染
        function renderAnnouncement() {
            const banner = document.getElementById('announcement-banner');
            const text = document.getElementById('announcement-text');
            const announceContent = localStorage.getItem(STORAGE_KEY_ANNOUNCE);

            if (announceContent) {
                banner.classList.remove('hidden');
                text.textContent = announceContent;
            } else {
                banner.classList.add('hidden');
            }
        }

        // 分類篩選
        function setFilter(category
