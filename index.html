    <!-- System Announcement Edit Modal (Admin Only) -->

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <!-- Application Script Engine -->
    <script>
        // BroadcastChannel for instant multi-tab / multi-window / cross-device local sync
        const channel = new BroadcastChannel('message_board_sync_channel');

        // State variables
        let currentUser = JSON.parse(localStorage.getItem('mb_current_user')) || null; // {username, isAdmin}
        let currentCategory = 'all';
        let searchQuery = '';
        let isRegisterMode = false;

        // Default Seed Data Initialization
        if (!localStorage.getItem('mb_users')) {
            const defaultUsers = [
                { username: 'Johnny', password: '20190309', isAdmin: true }
            ];
            localStorage.setItem('mb_users', JSON.stringify(defaultUsers));
        }

        if (!localStorage.getItem('mb_messages')) {
            const defaultMessages = [
                {
                    id: 'msg_welcome',
                    author: 'Johnny',
                    isAdmin: true,
                    category: 'announcement',
                    content: '歡迎來到全新升級的跨裝置即時留言板！本系統支援一鍵共用網址、帳號註冊與管理員完整控制功能，快點擊右上角分享給朋友吧！',
                    imageUrl: '',
                    timestamp: Date.now() - 3600000,
                    isPinned: true,
                    likes: ['Johnny'],
                    replies: [
                        { id: 'rep_1', author: '熱心網友', isAdmin: false, content: '太棒了！介面非常流暢且支援深色模式！', timestamp: Date.now() - 1800000 }
                    ]
                }
            ];
            localStorage.setItem('mb_messages', JSON.stringify(defaultMessages));
        }

        if (!localStorage.getItem('mb_system')) {
            localStorage.setItem('mb_system', JSON.stringify({
                announcement: '📢 系統提示：歡迎使用跨裝置留言板，點擊頂部「複製共用網址」即可一鍵分享！',
                bannedUsers: []
            }));
        }

        // Helper: Show Toast Notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : type === 'warning' ? 'bg-amber-600' : 'bg-gray-800';
            toast.className = `${bg} text-white text-xs sm:text-sm px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${type==='error'?'fa-circle-exclamation':type==='success'?'fa-circle-check':'fa-circle-info'}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 1. Share URL Button Action
        document.getElementById('btn-share-url').onclick = () => {
            const currentUrl = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentUrl).then(() => {
                    showToast('已成功複製共用網址，快貼給好友吧！', 'success');
                }).catch(() => fallbackCopy(currentUrl));
            } else {
                fallbackCopy(currentUrl);
            }
        };

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('已成功複製共用網址！', 'success');
            } catch (err) {
                showToast('複製網址失敗，請手動複製瀏覽器網址列', 'error');
            }
            document.body.removeChild(textArea);
        }

        function broadcastChange() {
            channel.postMessage({ type: 'BOARD_DATA_UPDATED', timestamp: Date.now() });
        }

        channel.onmessage = (event) => {
            if (event.data && event.data.type === 'BOARD_DATA_UPDATED') {

                renderAll();

        // Render Messages Feed
        function renderMessagesFeed() {
            const messages = JSON.parse(localStorage.getItem('mb_messages')) || [];
            const feed = document.getElementById('messages-feed');
            const system = JSON.parse(localStorage.getItem('mb_system'));

            let filtered = messages.filter(msg => {
                const matchCat = currentCategory === 'all' || msg.category === currentCategory;
                const matchSearch = searchQuery === '' || 
                    msg.content.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    msg.author.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            // Sort: pinned first, then newest timestamp
            filtered.sort((a, b) => {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                return b.timestamp - a.timestamp;
            });

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700">
                        <i class="fa-regular fa-comment-dots text-3xl text-gray-300 dark:text-gray-600 mb-2"></i>
                        <p class="text-gray-500 dark:text-gray-400 text-xs">目前沒有找到符合條件的留言紀錄。</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = filtered.map(msg => {
                const isPinned = msg.isPinned;
                const timeStr = new Date(msg.timestamp).toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const isUserLiked = currentUser && msg.likes && msg.likes.includes(currentUser.username);
                const isAdminOrJohnny = currentUser && (currentUser.isAdmin || currentUser.username === 'Johnny');

                const catBadge = {
                    'announcement': '<span class="bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300 text-[10px] px-2 py-0.5 rounded-md font-medium">📢 公告</span>',
                    'discussion': '<span class="bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 text-[10px] px-2 py-0.5 rounded-md font-medium">💬 討論</span>',
                    'question': '<span class="bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300 text-[10px] px-2 py-0.5 rounded-md font-medium">❓ 問答</span>',
                    'chat': '<span class="bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 text-[10px] px-2 py-0.5 rounded-md font-medium">☕ 閒聊</span>'
                }[msg.category] || '';

                const repliesHTML = (msg.replies || []).map(r => `
                    <div class="bg-gray-50 dark:bg-gray-700/40 p-2.5 rounded-xl text-xs space-y-1 border border-gray-100 dark:border-gray-700/60">
                        <div class="flex items-center justify-between text-gray-400">
                            <span class="font-semibold text-gray-700 dark:text-gray-300 flex items-center gap-1">
                                ${r.isAdmin ? '<span class="bg-amber-500 text-white text-[9px] px-1 rounded">Admin</span>' : ''}
                                ${escapeHTML(r.author)}
                            </span>
                            <span class="text-[10px]">${new Date(r.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <p class="text-gray-800 dark:text-gray-200 leading-relaxed">${escapeHTML(r.content)}</p>
                    </div>
                `).join('');

                const isAuthorBanned = system.bannedUsers.includes(msg.author);

                return `
                    <div class="bg-white dark:bg-gray-800 p-4 sm:p-5 rounded-2xl border ${isPinned ? 'border-amber-400 ring-2 ring-amber-400/20' : 'border-gray-200 dark:border-gray-700'} shadow-sm transition">
                        <!-- Header -->
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(msg.author)}" class="w-9 h-9 rounded-full border border-gray-200 dark:border-gray-700 bg-gray-50">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-semibold text-xs sm:text-sm text-gray-900 dark:text-white">${escapeHTML(msg.author)}</span>
                                        ${msg.isAdmin ? '<span class="bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.2 rounded">管理員</span>' : ''}
                                        ${catBadge}
                                    </div>
                                    <span class="text-[11px] text-gray-400">${timeStr}</span>
                                </div>
                            </div>

                            <!-- Admin Menu / Pin Badge -->
                            <div class="flex items-center gap-1">
                                ${isPinned ? '<span class="text-amber-500 text-[11px] font-semibold px-2 py-0.5 bg-amber-50 dark:bg-amber-900/30 rounded-lg"><i class="fa-solid fa-thumbtack mr-1"></i>置頂</span>' : ''}
                                
                                ${isAdminOrJohnny ? `
                                    <div class="relative group">
                                        <button class="p-1.5 text-gray-400 hover:text-amber-500 rounded-lg">
                                            <i class="fa-solid fa-ellipsis-vertical"></i>
                                        </button>
                                        <div class="hidden group-hover:block absolute right-0 z-20 w-36 bg-white dark:bg-gray-700 rounded-xl shadow-xl border border-gray-200 dark:border-gray-600 p-1 text-xs">
                                            <button class="btn-action-pin w-full text-left px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-600 rounded-lg" data-id="${msg.id}">
                                                <i class="fa-solid fa-thumbtack mr-1"></i> ${isPinned ? '取消置頂' : '置頂留言'}
                                            </button>
                                            <button class="btn-action-ban w-full text-left px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-600 rounded-lg text-amber-600 dark:text-amber-400" data-author="${msg.author}">
                                                <i class="fa-solid fa-ban mr-1"></i> ${isAuthorBanned ? '解除禁言' : '禁言作者'}
                                            </button>
                                            <button class="btn-action-del w-full text-left px-3 py-1.5 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg text-red-600 dark:text-red-400" data-id="${msg.id}">
                                                <i class="fa-solid fa-trash mr-1"></i> 刪除留言
                                            </button>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Content -->
                        <p class="text-xs sm:text-sm text-gray-800 dark:text-gray-200 mb-3 whitespace-pre-line leading-relaxed">${escapeHTML(msg.content)}</p>

                        <!-- Attached Image -->
                        ${msg.imageUrl ? `
                            <div class="mb-3 rounded-xl overflow-hidden border border-gray-100 dark:border-gray-700 max-h-72 bg-gray-50">
                                <img src="${escapeHTML(msg.imageUrl)}" alt="Attached" class="w-full h-full object-cover" onerror="this.style.display='none'">
                            </div>
                        ` : ''}

                        <!-- Footer Actions -->
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100 dark:border-gray-700/60 text-xs text-gray-500">
                            <button class="btn-like-msg flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition ${isUserLiked ? 'text-red-500 font-bold' : ''}" data-id="${msg.id}">
                                <i class="fa-${isUserLiked ? 'solid' : 'regular'} fa-heart"></i>
                                <span>${msg.likes ? msg.likes.length : 0}</span>
                            </button>

                            <button class="btn-toggle-replies flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" data-id="${msg.id}">
                                <i class="fa-regular fa-comment"></i>
                                <span>回覆 (${msg.replies ? msg.replies.length : 0})</span>
                            </button>
                        </div>

                        <!-- Replies Section -->
                        <div id="reply-panel-${msg.id}" class="mt-3 space-y-2 pt-2 border-t border-dashed border-gray-200 dark:border-gray-700 hidden">
                            <div class="space-y-2 mb-2">
                                ${repliesHTML}
                            </div>
                            <div class="flex gap-2">
                                <input type="text" id="reply-input-${msg.id}" placeholder="寫下您的回覆..." class="flex-1 px-3 py-1.5 text-xs bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-1 focus:ring-brand-500">
                                <button class="btn-submit-reply px-3 py-1.5 bg-brand-500 hover:bg-brand-600 text-white text-xs rounded-xl transition" data-id="${msg.id}">送出</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            attachCardEventListeners();
        }

        // Attach event listeners to generated message cards
        function attachCardEventListeners() {
            // Like
            document.querySelectorAll('.btn-like-msg').forEach(btn => {
                btn.onclick = () => {
                    if (!currentUser) {
                        showToast('請先登入帳號後才能按讚！', 'warning');
                        openAuthModal();
                        return;
                    }
                    const id = btn.dataset.id;
                    let messages = JSON.parse(localStorage.getItem('mb_messages'));
                    const msg = messages.find(m => m.id === id);
                    if (!msg) return;

                    msg.likes = msg.likes || [];
                    if (msg.likes.includes(currentUser.username)) {
                        msg.likes = msg.likes.filter(u => u !== currentUser.username);
                    } else {
                        msg.likes.push(currentUser.username);
                    }
                    localStorage.setItem('mb_messages', JSON.stringify(messages));
                    broadcastChange();
                    renderMessagesFeed();
                };
            });

            // Toggle Reply box
            document.querySelectorAll('.btn-toggle-replies').forEach(btn => {
                btn.onclick = () => {
                    const panel = document.getElementById(`reply-panel-${btn.dataset.id}`);
                    panel.classList.toggle('hidden');
                };
            });

            // Submit Reply
            document.querySelectorAll('.btn-submit-reply').forEach(btn => {
                btn.onclick = () => {
                    if (!currentUser) {
                        showToast('請先登入帳號後才能回覆！', 'warning');
                        openAuthModal();
                        return;
                    }
                    const system = JSON.parse(localStorage.getItem('mb_system'));
                    if (system.bannedUsers.includes(currentUser.username)) {
                        showToast('您的帳號已被禁言，無法發布回覆', 'error');
                        return;
                    }

                    const id = btn.dataset.id;
                    const input = document.getElementById(`reply-input-${id}`);
                    const content = input.value.trim();
                    if (!content) return;

                    let messages = JSON.parse(localStorage.getItem('mb_messages'));
                    const msg = messages.find(m => m.id === id);
                    if (!msg) return;

                    msg.replies = msg.replies || [];
                    msg.replies.push({
                        id: 'rep_' + Date.now(),
                        author: currentUser.username,
                        isAdmin: currentUser.isAdmin || currentUser.username === 'Johnny',
                        content: content,
                        timestamp: Date.now()
                    });

                    localStorage.setItem('mb_messages', JSON.stringify(messages));
                    broadcastChange();
                    renderAll();
                    showToast('回覆發布成功！', 'success');
                };
            });

            // Admin Actions: Pin
            document.querySelectorAll('.btn-action-pin').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.dataset.id;
                    let messages = JSON.parse(localStorage.getItem('mb_messages'));
                    const msg = messages.find(m => m.id === id);
                    if (msg) {
                        msg.isPinned = !msg.isPinned;
                        localStorage.setItem('mb_messages', JSON.stringify(messages));
                        broadcastChange();
                        renderAll();
                        showToast(msg.isPinned ? '已成功置頂留言' : '已取消置頂', 'info');
                    }
                };
            });

            // Admin Actions: Ban User
            document.querySelectorAll('.btn-action-ban').forEach(btn => {
                btn.onclick = () => {
                    const author = btn.dataset.author;
                    let system = JSON.parse(localStorage.getItem('mb_system'));
                    system.bannedUsers = system.bannedUsers || [];
                    
                    if (system.bannedUsers.includes(author)) {
                        system.bannedUsers = system.bannedUsers.filter(a => a !== author);
                        showToast(`已解除使用者 ${author} 的禁言`, 'success');
                    } else {
                        system.bannedUsers.push(author);
                        showToast(`已成功禁言使用者 ${author}`, 'warning');
                    }
                    localStorage.setItem('mb_system', JSON.stringify(system));
                    broadcastChange();
                    renderAll();
                };
            });

            // Admin Actions: Delete
            document.querySelectorAll('.btn-action-del').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.dataset.id;
                    let messages = JSON.parse(localStorage.getItem('mb_messages'));
                    messages = messages.filter(m => m.id !== id);
                    localStorage.setItem('mb_messages', JSON.stringify(messages));
                    broadcastChange();
                    renderAll();
                    showToast('留言已刪除', 'info');
                };
            });
        }

        // Submit New Message
        document.getElementById('btn-submit-post').onclick = () => {
            if (!currentUser) {
                showToast('請先登入帳號後再發布留言！', 'warning');
                openAuthModal();
                return;
            }

            const system = JSON.parse(localStorage.getItem('mb_system'));
            if (system.bannedUsers.includes(currentUser.username)) {
                showToast('您的帳號已被禁言，無法發布留言', 'error');
                return;
            }

            const category = document.getElementById('post-category').value;
            const content = document.getElementById('post-content').value.trim();
            const imageUrl = document.getElementById('post-image-url').value.trim();

            if (!content) {
                showToast('請輸入留言內容！', 'warning');
                return;
            }

            const newMsg = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
                author: currentUser.username,
                isAdmin: currentUser.isAdmin || currentUser.username === 'Johnny',
                category: category,
                content: content,
                imageUrl: imageUrl,
                timestamp: Date.now(),
                isPinned: false,
                likes: [],
                replies: []
            };

            let messages = JSON.parse(localStorage.getItem('mb_messages')) || [];
            messages.unshift(newMsg);
            localStorage.setItem('mb_messages', JSON.stringify(messages));

            // Reset inputs
            document.getElementById('post-content').value = '';
            document.getElementById('post-image-url').value = '';
            document.getElementById('image-url-box').classList.add('hidden');

            broadcastChange();
            renderAll();
            showToast('留言發布成功並已同步！', 'success');
        };

        // Category Filters & Search
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.classList.remove('bg-brand-50', 'text-brand-700', 'dark:bg-brand-900/30', 'dark:text-brand-300');
                    b.classList.add('text-gray-600', 'dark:text-gray-300');
                });
                btn.classList.add('bg-brand-50', 'text-brand-700', 'dark:bg-brand-900/30', 'dark:text-brand-300');
                btn.classList.remove('text-gray-600', 'dark:text-gray-300');

                currentCategory = btn.dataset.cat;
                renderMessagesFeed();
            };
        });

        document.getElementById('search-input').oninput = (e) => {
            searchQuery = e.target.value.trim();
            renderMessagesFeed();
        };

        function updateCategoryCounts() {
            const messages = JSON.parse(localStorage.getItem('mb_messages')) || [];
            document.getElementById('cnt-all').innerText = messages.length;
            document.getElementById('cnt-announcement').innerText = messages.filter(m => m.category === 'announcement').length;
            document.getElementById('cnt-discussion').innerText = messages.filter(m => m.category === 'discussion').length;
            document.getElementById('cnt-question').innerText = messages.filter(m => m.category === 'question').length;
            document.getElementById('cnt-chat').innerText = messages.filter(m => m.category === 'chat').length;
        }

        // Emoji Picker Dropdown
        const emojiBtn = document.getElementById('emoji-picker-btn');
        const emojiDropdown = document.getElementById('emoji-dropdown');

        emojiBtn.onclick = (e) => {
            e.stopPropagation();
            emojiDropdown.classList.toggle('hidden');
        };

        document.querySelectorAll('.emoji-opt').forEach(opt => {
            opt.onclick = () => {
                const textarea = document.getElementById('post-content');
                textarea.value += opt.innerText;
                emojiDropdown.classList.add('hidden');
                textarea.focus();
            };
        });

        document.addEventListener('click', () => {
            emojiDropdown.classList.add('hidden');
        });

        // Toggle Image URL Input
        document.getElementById('toggle-img-input').onclick = () => {
            document.getElementById('image-url-box').classList.toggle('hidden');
        };

        // Auth Modal Management
        const authModal = document.getElementById('auth-modal');
        function openAuthModal() {
            authModal.classList.remove('hidden');
        }
        document.getElementById('close-auth-modal').onclick = () => authModal.classList.add('hidden');

        document.getElementById('btn-switch-mode').onclick = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-modal-title').innerText = isRegisterMode ? '註冊新帳號' : '帳號登入';
            document.getElementById('auth-submit-btn').innerText = isRegisterMode ? '立即註冊' : '立即登入';
            document.getElementById('auth-switch-text').innerText = isRegisterMode ? '已經有帳號了？' : '還沒有帳號？';
            document.getElementById('btn-switch-mode').innerText = isRegisterMode ? '點此登入' : '點此註冊';
        };

        // 1-Click Admin Shortcut Login
        document.getElementById('btn-shortcut-admin').onclick = () => {
            document.getElementById('auth-username').value = 'Johnny';
            document.getElementById('auth-password').value = '20190309';
        };

        // Auth Form Submit (Login & Register)
        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errDiv = document.getElementById('auth-error-msg');

            let users = JSON.parse(localStorage.getItem('mb_users')) || [];

            if (isRegisterMode) {
                if (users.some(u => u.username === username)) {
                    errDiv.innerText = '此帳號名稱已被註冊，請換一個名字！';
                    errDiv.classList.remove('hidden');
                    return;
                }
                const newUser = {
                    username: username,
                    password: password,
                    isAdmin: username === 'Johnny'
                };
                users.push(newUser);
                localStorage.setItem('mb_users', JSON.stringify(users));
                
                currentUser = { username: newUser.username, isAdmin: newUser.isAdmin };
                localStorage.setItem('mb_current_user', JSON.stringify(currentUser));
                authModal.classList.add('hidden');
                broadcastChange();
                renderAll();
                showToast(`註冊成功！已自動登入為 ${username}`, 'success');
            } else {
                // Login check
                const matched = users.find(u => u.username === username && u.password === password);
                if (matched || (username === 'Johnny' && password === '20190309')) {
                    currentUser = {
                        username: username,
                        isAdmin: username === 'Johnny' || (matched && matched.isAdmin)
                    };
                    localStorage.setItem('mb_current_user', JSON.stringify(currentUser));
                    authModal.classList.add('hidden');
                    errDiv.classList.add('hidden');
                    broadcastChange();
                    renderAll();
                    showToast(`歡迎回來，${username}！`, 'success');
                } else {
                    errDiv.innerText = '帳號或密碼錯誤，請重新確認！';
                    errDiv.classList.remove('hidden');
                }
            }
        };

        // Admin Announcement Modal
        const annModal = document.getElementById('announcement-modal');
        document.getElementById('btn-open-announcement-modal').onclick = () => {
            const system = JSON.parse(localStorage.getItem('mb_system'));
            document.getElementById('announcement-textarea').value = system.announcement || '';
            annModal.classList.remove('hidden');
        };
        document.getElementById('close-ann-modal').onclick = () => annModal.classList.add('hidden');

        document.getElementById('btn-save-ann').onclick = () => {
            const text = document.getElementById('announcement-textarea').value.trim();
            let system = JSON.parse(localStorage.getItem('mb_system'));
            system.announcement = text;
            localStorage.setItem('mb_system', JSON.stringify(system));
            annModal.classList.add('hidden');
            broadcastChange();
            renderAll();
            showToast('系統公告已即時更新！', 'success');
        };

        document.getElementById('btn-clear-ann').onclick = () => {
            document.getElementById('announcement-textarea').value = '';
            let system = JSON.parse(localStorage.getItem('mb_system'));
            system.announcement = '';
            localStorage.setItem('mb_system', JSON.stringify(system));
            annModal.classList.add('hidden');
            broadcastChange();
            renderAll();
            showToast('已清除系統公告', 'info');
        };

        // Admin Clear All Data
        document.getElementById('btn-clear-all-data').onclick = () => {
            if (confirm('確定要清空全站所有留言資料嗎？此動作無法復原！')) {
                localStorage.setItem('mb_messages', JSON.stringify([]));
                broadcastChange();
                renderAll();
                showToast('已清空全站留言', 'warning');
            }
        };

        // Dark / Light Theme Toggle
        document.getElementById('theme-toggle').onclick = () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        }

        // HTML Escaper helper
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[m]);
        }

        // Initial render on load
        renderAll();
    </script>
</body>
</html>
